<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Logic Challenge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="game-card">

        <div class="level-title">
            LEVEL 3
        </div>

        <h1>🧠 Logic Challenge</h1>

        <p id="playerDisplay"></p>

        <div class="game-info">

            <span id="lives">
                ❤️ ❤️ ❤️
            </span>

            <span>
                🏆 Score:
                <b id="score">0</b>
            </span>

            <span>
                ⏱️
                <b id="timer">30</b>s
            </span>

        </div>

        <div class="progress">

            <div id="progressBar"></div>

        </div>

        <h2 id="questionNumber">
            Question 1 / 5
        </h2>

        <div class="question-box">

            <p id="question"></p>

        </div>

        <div class="options">

            <button onclick="checkAnswer(0)"
                    id="option0">
            </button>

            <button onclick="checkAnswer(1)"
                    id="option1">
            </button>

            <button onclick="checkAnswer(2)"
                    id="option2">
            </button>

            <button onclick="checkAnswer(3)"
                    id="option3">
            </button>

        </div>

        <button class="hint-button"
                onclick="showHint()">

            💡 AI HINT

        </button>

        <p id="hint"></p>

        <p id="message"></p>

    </div>

</div>


<script>

let score = 0;

let correctAnswers = 0;

let lives = 3;

let currentQuestion = 0;

let timeLeft = 30;

let timer;

let answered = false;


const playerName =
    localStorage.getItem("playerName") || "Player";

document.getElementById("playerDisplay").innerText =
    "👤 Player: " + playerName;


const questions = [

    {
        question:
            "What comes next? 2, 4, 8, 16, ?",

        options: [
            "20",
            "24",
            "32",
            "36"
        ],

        answer: 2,

        hint:
            "🤖 AI Hint: Each number is multiplied by 2."
    },


    {
        question:
            "What comes next? 5, 10, 15, 20, ?",

        options: [
            "22",
            "25",
            "30",
            "35"
        ],

        answer: 1,

        hint:
            "🤖 AI Hint: The numbers increase by the same amount."
    },


    {
        question:
            "If all cats are animals and Tom is a cat, what is Tom?",

        options: [
            "A plant",
            "An animal",
            "A computer",
            "A bird"
        ],

        answer: 1,

        hint:
            "🤖 AI Hint: Tom belongs to the cat group."
    },


    {
        question:
            "A clock shows 3:00. What angle is between the hands?",

        options: [
            "45 degrees",
            "60 degrees",
            "90 degrees",
            "180 degrees"
        ],

        answer: 2,

        hint:
            "🤖 AI Hint: Think about the angle between 12 and 3."
    },


    {
        question:
            "If 3 workers finish a job in 6 days, how many worker-days are needed?",

        options: [
            "9",
            "12",
            "18",
            "24"
        ],

        answer: 2,

        hint:
            "🤖 AI Hint: Multiply workers by number of days."
    }

];


function loadQuestion() {

    answered = false;

    const q =
        questions[currentQuestion];


    document.getElementById("questionNumber").innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document.getElementById("question").innerText =
        q.question;


    for (let i = 0; i < 4; i++) {

        const button =
            document.getElementById(
                "option" + i
            );

        button.innerText =
            String.fromCharCode(65 + i) +
            ") " +
            q.options[i];

        button.disabled = false;

    }


    document.getElementById("hint").innerText = "";

    document.getElementById("message").innerText = "";

    updateLives();

    updateProgress();

    startTimer();

}


function checkAnswer(selected) {

    if (answered) {
        return;
    }

    const q =
        questions[currentQuestion];


    if (selected === q.answer) {

        answered = true;

        score += 10;

        correctAnswers++;

        document.getElementById("score").innerText =
            score;

        document.getElementById("message").innerText =
            "✅ Correct! +10 points";

        disableOptions();

        clearInterval(timer);

        setTimeout(
            nextQuestion,
            900
        );

    }

    else {

        lives--;

        updateLives();

        document.getElementById("message").innerText =
            "❌ Wrong answer!";


        if (lives <= 0) {

            gameOver();

        }

    }

}


function disableOptions() {

    for (let i = 0; i < 4; i++) {

        document.getElementById(
            "option" + i
        ).disabled = true;

    }

}


function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        questions.length
    ) {

        levelComplete();

    }

    else {

        loadQuestion();

    }

}


function updateLives() {

    let hearts = "";

    for (let i = 0; i < lives; i++) {

        hearts += "❤️ ";

    }

    document.getElementById("lives").innerText =
        hearts;

}


function updateProgress() {

    const progress =
        ((currentQuestion + 1) /
        questions.length) * 100;

    document.getElementById(
        "progressBar"
    ).style.width = progress + "%";

}


function showHint() {

    document.getElementById("hint").innerText =
        questions[currentQuestion].hint;

}


function startTimer() {

    clearInterval(timer);

    timeLeft = 30;

    document.getElementById("timer").innerText =
        timeLeft;


    timer = setInterval(function() {

        timeLeft--;

        document.getElementById("timer").innerText =
            timeLeft;


        if (timeLeft <= 0) {

            clearInterval(timer);

            lives--;

            updateLives();

            document.getElementById("message").innerText =
                "⏰ Time's up!";


            if (lives <= 0) {

                gameOver();

            }

            else {

                setTimeout(
                    nextQuestion,
                    1000
                );

            }

        }

    }, 1000);

}


function gameOver() {

    clearInterval(timer);

    localStorage.setItem(
        "logicScore",
        score
    );

    localStorage.setItem(
        "logicCorrect",
        correctAnswers
    );

    alert(
        "💀 Game Over!\nYour Logic Score: " +
        score
    );

    window.location.href = "/";

}


function levelComplete() {

    clearInterval(timer);

    localStorage.setItem(
        "logicScore",
        score
    );

    localStorage.setItem(
        "logicCorrect",
        correctAnswers
    );


    document.getElementById("message").innerText =
        "🎉 Logic Level Complete!";


    setTimeout(function() {

        window.location.href = "/lock";

    }, 1200);

}


loadQuestion();

</script>

</body>

</html>
