<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Python Challenge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="game-card">

        <div class="level-title">
            LEVEL 1
        </div>

        <h1>🐍 Python Challenge</h1>

        <p id="playerDisplay"></p>

        <div class="game-info">

            <span id="lives">
                ❤️ ❤️ ❤️
            </span>

            <span>
                🏆 Score:
                <b id="score">0</b>
            </span>

            <span>
                ⏱️
                <b id="timer">30</b>s
            </span>

        </div>

        <div class="progress">

            <div id="progressBar"></div>

        </div>

        <h2 id="questionNumber">
            Question 1 / 5
        </h2>

        <div class="question-box">

            <p id="question"></p>

            <pre id="code"></pre>

        </div>

        <div class="options">

            <button
                onclick="checkAnswer(0)"
                id="option0">
            </button>

            <button
                onclick="checkAnswer(1)"
                id="option1">
            </button>

            <button
                onclick="checkAnswer(2)"
                id="option2">
            </button>

            <button
                onclick="checkAnswer(3)"
                id="option3">
            </button>

        </div>

        <button
            class="hint-button"
            onclick="showHint()">

            💡 AI HINT

        </button>

        <p id="hint"></p>

        <p id="message"></p>

    </div>

</div>


<script src="{{ url_for('static', filename='game.js') }}"></script>

</body>

</html>
