<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ challenge.title }} · Campus Escape Challenge</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>.challenge-shell{width:min(820px,100%);margin:2rem auto;padding:0 1rem}.challenge-card{padding:clamp(1.1rem,4vw,2rem);border:1px solid rgba(56,189,248,.25);border-radius:20px;background:rgba(15,23,42,.9)}.share-tag{color:#5eead4;font-size:.68rem;font-weight:800;letter-spacing:.13em}.challenge-card h1{margin:.45rem 0;font-size:clamp(1.45rem,4vw,2rem)}.challenge-card p{color:#a8b6ca;line-height:1.6}.challenge-code{width:100%;min-height:210px;margin:1rem 0;padding:.9rem;border:1px solid rgba(148,163,184,.2);border-radius:12px;background:#020617;color:#e2e8f0;font: .85rem/1.5 'Fira Code',monospace;resize:vertical}.challenge-buttons{display:flex;gap:.6rem;flex-wrap:wrap}.challenge-buttons button{padding:.7rem .9rem;border-radius:10px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.12);color:#bae6fd;font-weight:800;cursor:pointer}.challenge-output{min-height:70px;margin:1rem 0;padding:.8rem;border:1px solid rgba(148,163,184,.16);border-radius:10px;background:#020617;color:#cbd5e1;white-space:pre-wrap}.challenge-result{font-weight:800;color:#5eead4}.challenge-result.fail{color:#fbbf24}</style>    <link rel="stylesheet" href="{{ url_for('static', filename='visual-refresh.css') }}">
</head>
<body>{% include "_global_nav.html" %}<main class="challenge-shell"><section class="challenge-card" data-expected="{{ challenge.expectedOutput|e }}"><span class="share-tag">CHALLENGE A FRIEND</span><h1>{{ challenge.title }}</h1><p>{{ challenge.description }}</p><p>Make your fix, run it, and compare your solve time with the challenger.</p><textarea id="challengeCode" class="challenge-code" spellcheck="false">{{ challenge.starterCode }}</textarea><div class="challenge-buttons"><button type="button" onclick="runChallenge()">Run &amp; check</button><button type="button" onclick="copyChallenge()">Copy challenge link</button><a class="btn-back" href="/map">Map</a></div><pre id="challengeOutput" class="challenge-output">Output appears here.</pre><p id="challengeResult" class="challenge-result" role="status"></p>{% if not authenticated %}<p><a href="/">Sign in to run the shared challenge.</a></p>{% endif %}</section></main>
<script>
const startedAt=performance.now();const expected=document.querySelector('.challenge-card').dataset.expected;
async function runChallenge(){const out=document.getElementById('challengeOutput'),result=document.getElementById('challengeResult');out.textContent='Running…';try{const response=await fetch('/api/debug/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:{{ language|tojson }},code:document.getElementById('challengeCode').value})});const data=await response.json();if(!response.ok)throw new Error(data.message||'Sign in to run the shared challenge.');out.textContent=data.stdout||data.stderr||'(no output)';if(data.success&&data.stdout.trim()===expected.trim()){const seconds=Math.max(1,Math.round((performance.now()-startedAt)/1000));const target=Number(new URLSearchParams(location.search).get('target'))||null;result.classList.remove('fail');result.textContent=target?('Solved in '+seconds+'s. Challenger: '+target+'s. '+(seconds<target?'You were faster!':seconds===target?'It is a tie!':'Challenge them to a rematch.')):('Solved in '+seconds+'s! Share your time with a friend.');if(window.celebrateMilestone)celebrateMilestone();history.replaceState({},'',location.pathname+'?target='+seconds);}else{result.classList.add('fail');result.textContent='Output does not match the expected result yet.';}}catch(e){out.textContent=e.message;result.textContent='';}}
async function copyChallenge(){const seconds=Number(new URLSearchParams(location.search).get('target'))||null;const link=location.origin+location.pathname+(seconds?'?target='+seconds:'');try{await navigator.clipboard.writeText(link);document.getElementById('challengeResult').textContent='Challenge link copied.';}catch(e){document.getElementById('challengeResult').textContent=link;}}
</script><script src="{{ url_for('static', filename='celebrate.js') }}"></script></body></html>
