<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Performance Report</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="game-card">

        <div class="icon">
            🏆
        </div>

        <h1>AI Performance Report</h1>

        <p id="player"></p>


        <div class="question-box">

            <h2>📊 Performance</h2>

            <div class="result-row">
                🐍 Python
                <strong id="python"></strong>
            </div>

            <div class="result-row">
                💻 C Programming
                <strong id="c"></strong>
            </div>

            <div class="result-row">
                🧠 Logic
                <strong id="logic"></strong>
            </div>

            <div class="result-row">
                🤖 AI Challenge
                <strong id="ai"></strong>
            </div>

        </div>


        <h2 id="total"></h2>

        <div class="rank-box">

            <h2 id="rank"></h2>

            <p id="recommendation"></p>

        </div>


        <button onclick="restartGame()">

            🔄 PLAY AGAIN

        </button>

    </div>

</div>


<script>

const playerName =
    localStorage.getItem("playerName") ||
    "Player";


const python =
    Number(
        localStorage.getItem("pythonScore")
    ) || 0;


const c =
    Number(
        localStorage.getItem("cScore")
    ) || 0;


const logic =
    Number(
        localStorage.getItem("logicScore")
    ) || 0;


const ai =
    Number(
        localStorage.getItem("aiScore")
    ) || 0;


document.getElementById("player").innerText =
    "👤 Player: " + playerName;


document.getElementById("python").innerText =
    python + " / 50";


document.getElementById("c").innerText =
    c + " / 50";


document.getElementById("logic").innerText =
    logic + " / 50";


document.getElementById("ai").innerText =
    ai + " / 10";


const total =
    python +
    c +
    logic +
    ai;


const maximum = 160;


const percentage =
    Math.round(
        (total / maximum) * 100
    );


document.getElementById("total").innerText =
    "🎯 Total Score: " +
    total +
    " / " +
    maximum;


let rank;

let recommendation;


if (percentage >= 85) {

    rank =
        "🏆 CODING MASTER";

    recommendation =
        "🤖 AI: Excellent! Try advanced programming challenges.";

}

else if (percentage >= 70) {

    rank =
        "🚀 CODING EXPLORER";

    recommendation =
        "🤖 AI: Good performance. Continue practicing problem solving.";

}

else if (percentage >= 50) {

    rank =
        "💻 RISING PROGRAMMER";

    recommendation =
        "🤖 AI: Practice C and Python fundamentals.";

}

else {

    rank =
        "🌱 BEGINNER";

    recommendation =
        "🤖 AI: Start with basic programming exercises.";

}


document.getElementById("rank").innerText =
    rank;


document.getElementById(
    "recommendation"
).innerText =
    recommendation;


function restartGame() {

    localStorage.clear();

    window.location.href = "/";

}

</script>

</body>

</html>
