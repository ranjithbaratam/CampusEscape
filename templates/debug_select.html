<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Debugging Language - Campus Escape</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { align-items: center; justify-content: center; min-height: 100vh; }
        .select-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .select-card h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #10b981, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .select-card p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
        .lang-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
        .lang-option {
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 1.75rem 1rem;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s;
        }
        .lang-option:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3);
        }
        .lang-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .lang-title { font-size: 1.1rem; font-weight: 800; }
        .lang-desc { font-size: 0.75rem; color: #94a3b8; margin-top: 0.4rem; }
    </style>
</head>
<body>
    <div class="select-card">
        <h1>DEBUG LAB</h1>
        <p>CHOOSE YOUR PRACTICE LANGUAGE</p>

        <div class="lang-grid">
            <a href="/debug/python" class="lang-option">
                <div class="lang-icon">🐍</div>
                <div class="lang-title">PYTHON</div>
                <div class="lang-desc">{{ python_challenge_count }} guided challenges · hints and solutions</div>
            </a>
            <a href="/debug/c" class="lang-option">
                <div class="lang-icon">⚙️</div>
                <div class="lang-title">C PROGRAMMING</div>
                <div class="lang-desc">{{ c_challenge_count }} guided challenges · hints and solutions</div>
            </a>
        </div>

        <a href="/map" class="btn-back" style="display: inline-block; margin-top: 2rem;">← RETURN TO MAP</a>
    </div>
</body>
</html>
